<!DOCTYPE html>
<html lang="pt-PT">
<head>

  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!--
    O bloco entre os marcadores seo:default e o que o WhatsApp, o Instagram e
    o Facebook leem quando alguem partilha um link: eles nao correm
    JavaScript. No build, scripts/prerender.mjs substitui este bloco pelo
    titulo, descricao e cartao de cada pagina (dist/precos.html, etc.); aqui
    fica a versao geral, usada pela casca app.html e pelo `vite dev`.
  -->
  <!-- seo:default -->
  <title>Convecta — Marcações online e gestão para barbearias</title>
  <meta name="description" content="Software de marcações online e gestão para barbearias em Portugal. Os clientes marcam pelo site da barbearia, o barbeiro recebe a notificação no telemóvel e gere agenda, caixa, comissões e cartão de fidelidade. Planos desde 19,99 €/mês, sem comissões por marcação." />
  <link rel="canonical" href="https://convecta.pt" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Convecta" />
  <meta property="og:locale" content="pt_PT" />
  <meta property="og:title" content="Convecta — Marcações online e gestão para barbearias" />
  <meta property="og:description" content="Os teus clientes marcam sozinhos pelo site da tua barbearia. Tu recebes a notificação no telemóvel e geres agenda, caixa, comissões e cartão de fidelidade num só painel. Desde 19,99 €/mês, sem comissões." />

  <meta property="og:image" content="https://convecta.pt/og-image.png" />
  <meta property="og:image:secure_url" content="https://convecta.pt/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Convecta — marcações online para barbearias" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Convecta — Marcações online e gestão para barbearias" />
  <meta name="twitter:description" content="Os teus clientes marcam sozinhos pelo site da tua barbearia. Agenda, caixa, comissões e cartão de fidelidade num só painel. Desde 19,99 €/mês, sem comissões." />
  <meta name="twitter:image" content="https://convecta.pt/og-image.png" />
  <!-- /seo:default -->

  <!-- Icones: o "C" da marca, gerado a partir do logotipo novo -->
  <noscript>
    <style>
      /* O conteúdo entra com uma animação que começa em opacity:0. Sem
         JavaScript essa animação nunca corre e metade do site ficava em
         branco. Aqui força-se tudo a aparecer. */
      [style*="opacity: 0"], [style*="opacity:0"] {
        opacity: 1 !important; filter: none !important; transform: none !important;
      }
    </style>
  </noscript>

  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!--
    Sem Google Analytics enquanto nao houver uma propriedade criada. Quando
    houver, o ID vai para GA_ID em src/lib/seo.js e o script e carregado a
    partir de src/main.jsx — nao aqui — para que sem ID nao se carregue nada.
  -->
</head>

    <noscript>

          <li><a href="/comecar">Começar grátis</a></li>
          <li><a href="/funcionalidades">Funcionalidades</a> · <a href="/como-funciona">Como funciona</a> · <a href="/precos">Preços</a> · <a href="/faq">Perguntas frequentes</a> · <a href="/contacto">Contacto</a></li>
          <li>Telefone: <a href="tel:+351912381717">+351 912 381 717</a> · Email: <a href="mailto:geral@convecta.pt">geral@convecta.pt</a></li>
        </ul>
      </main>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
